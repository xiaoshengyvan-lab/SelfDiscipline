# 云构建：把工程推到 GitHub 后，在 Actions 页面自动编译 APK 并供下载
# 使用方法：
#   1. 在 GitHub 创建仓库并把本工程推上去
#   2. 打开仓库的 Actions 页面，选择 "Build APK" 工作流
#   3. 点击 "Run workflow"（或在 main/master 分支推送 / 打 v* 标签时自动触发）
#   4. 运行完成后在本次运行的 Artifacts 中下载 app-debug-apk 即可安装到手机
#   5. 打 v* 标签推送时，还会自动创建 GitHub Release，可直接从 Release 页面下载 APK

name: Build APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 镜像自带 SDK 时直接使用；缺失时才尝试安装（sdkmanager 可能不在 PATH，需全路径回退）
      - name: Set up Android SDK (ensure platform 34 + build-tools)
        run: |
          set -e
          if [ -d "$ANDROID_HOME/platforms/android-34" ] && [ -d "$ANDROID_HOME/build-tools/34.0.0" ]; then
            echo "SDK components already installed: platforms/android-34 + build-tools/34.0.0"
            exit 0
          fi
          SM="$(command -v sdkmanager 2>/dev/null || true)"
          if [ -z "$SM" ]; then
            for p in "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "$ANDROID_HOME/tools/bin/sdkmanager"; do
              [ -x "$p" ] && SM="$p" && break
            done
          fi
          if [ -z "$SM" ]; then
            echo "::error::sdkmanager not found (ANDROID_HOME=$ANDROID_HOME)"
            ls "$ANDROID_HOME" 2>/dev/null || true
            exit 1
          fi
          yes | "$SM" --licenses >/dev/null 2>&1 || true
          # 安装带重试，避免瞬时网络故障
          for i in 1 2 3; do
            "$SM" --install "platforms;android-34" "build-tools;34.0.0" "platform-tools" >/dev/null 2>&1 && break
            sleep 5
          done || true
          ls "$ANDROID_HOME/platforms" 2>/dev/null || true

      # 仓库未包含 gradle-wrapper.jar（二进制文件无法在此环境生成），
      # 云端联网后从 Gradle 官方仓库恢复（带镜像兜底 + 重试）
      - name: Restore Gradle wrapper jar
        run: |
          for i in 1 2 3; do
            curl -fsSL -o gradle/wrapper/gradle-wrapper.jar \
              https://raw.githubusercontent.com/gradle/gradle/v8.9.0/gradle/wrapper/gradle-wrapper.jar && break
            curl -fsSL -o gradle/wrapper/gradle-wrapper.jar \
              https://cdn.jsdelivr.net/gh/gradle/gradle@v8.9.0/gradle/wrapper/gradle-wrapper.jar && break
            sleep 5
          done
          ls -l gradle/wrapper/gradle-wrapper.jar
          chmod +x gradlew

      - name: Set up Gradle (含构建缓存)
        uses: gradle/actions/setup-gradle@v3

      - name: Build debug APK (log to summary)
        continue-on-error: true
        run: |
          ./gradlew assembleDebug --stacktrace > /tmp/build.log 2>&1 || true
          {
            echo "### Build tail"
            tail -n 100 /tmp/build.log
            echo ""
            echo "### Errors"
            grep -nE "e: |error:|What went wrong|Caused by|FAILURE|Execution failed|Could not|Unresolved" /tmp/build.log | tail -n 50
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK (Actions 产物)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

  # 打 v* 标签时：自动发布 GitHub Release，APK 挂载在 Release 页面可直接下载
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: app-debug-apk
          path: apk

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          files: apk/app-debug.apk
          generate_release_notes: true
